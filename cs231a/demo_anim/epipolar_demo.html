<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Epipolar Geometry Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f8f5ef;
      color: #222;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 20px 24px;
    }
    h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    .desc {
      color: #666;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 14px;
    }
    .panel {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 6px 28px rgba(0, 0, 0, 0.08);
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      background: linear-gradient(180deg, #fcfbf7 0%, #f6f1e7 100%);
    }
    .ctrl {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 8px 18px;
      background: #0f766e;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }
    input[type="range"] {
      flex: 1;
      max-width: 380px;
    }
    .info {
      font-size: 13px;
      color: #888;
    }
    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 10px;
      font-size: 12.5px;
      color: #666;
    }
    .sw {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>对极几何动画演示</h2>
    <div class="desc">
      固定左像平面上的像点 <strong>p</strong>，令空间点 <strong>P</strong> 沿着左相机光心
      <strong>O₁</strong> 到 <strong>p</strong> 的同一条视线前后移动。右像点 <strong>p′</strong>
      不是手工乱拖，而是由右相机的真实投影公式算出来，所以它会始终落在同一条对极线
      <strong>ℓ′</strong> 上。
    </div>

    <div class="panel">
      <canvas id="c" width="940" height="560"></canvas>
      <div class="ctrl">
        <button id="btn">暂停</button>
        <input id="sl" type="range" min="0" max="100" value="40" />
        <span class="info" id="info"></span>
      </div>
      <div class="legend">
        <span><span class="sw" style="background:#e84d2a"></span>空间点 P</span>
        <span><span class="sw" style="background:#2563eb"></span>对极线 ℓ / ℓ′</span>
        <span><span class="sw" style="background:#d97706"></span>基线 O₁O₂</span>
        <span><span class="sw" style="background:#7c3aed"></span>对极平面</span>
        <span><span class="sw" style="background:#059669"></span>像点 p / p′</span>
      </div>
    </div>
  </div>

  <script>
    const cvs = document.getElementById("c");
    const ctx = cvs.getContext("2d");
    const CW = cvs.width;
    const CH = cvs.height;

    const O1w = [0, 0, 0];
    const O2w = [10, 0, 0];
    const LX = 3;
    const RX = 7;
    const HY = 1.5;
    const HZ = 1.5;

    const pw = [LX, 0.7, 0.55];
    const eLw = [LX, 0, 0];
    const eRw = [RX, 0, 0];

    const tMin = 1.0;
    const tMax = 2.05;

    function getP(t) {
      return [pw[0] * t, pw[1] * t, pw[2] * t];
    }

    function getPrime(t) {
      const P = getP(t);
      const dx = P[0] - O2w[0];
      const dy = P[1] - O2w[1];
      const dz = P[2] - O2w[2];
      const s = (RX - O2w[0]) / dx;
      return [RX, O2w[1] + s * dy, O2w[2] + s * dz];
    }

    function epiPts(px) {
      const dy = pw[1];
      const dz = pw[2];
      const tp = Math.min(HY / dy, HZ / dz);
      return [[px, -dy * tp, -dz * tp], [px, dy * tp, dz * tp]];
    }

    const [eLn, eLp] = epiPts(LX);
    const [eRn, eRp] = epiPts(RX);

    function planeCorners(px) {
      return [[px, -HY, -HZ], [px, HY, -HZ], [px, HY, HZ], [px, -HY, HZ]];
    }

    const OX = 100;
    const OY = 470;
    const aX = [70, 0];
    const aY = [28, 11];
    const aZ = [0, -62];

    function prj([wx, wy, wz]) {
      return [
        OX + wx * aX[0] + wy * aY[0] + wz * aZ[0],
        OY + wx * aX[1] + wy * aY[1] + wz * aZ[1]
      ];
    }

    function poly(pts3d, fill, stroke, lw = 1.5) {
      const pts = pts3d.map(prj);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i += 1) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lw;
        ctx.stroke();
      }
      ctx.restore();
    }

    function seg(a3, b3, color, lw = 2, dash = []) {
      const [ax, ay] = prj(a3);
      const [bx, by] = prj(b3);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = lw;
      ctx.setLineDash(dash);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.stroke();
      ctx.restore();
    }

    function dot([cx, cy], r, fill, stroke = "#222", sw = 2) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = stroke;
      ctx.lineWidth = sw;
      ctx.stroke();
      ctx.restore();
    }

    function lbl(text, [sx, sy], dx, dy, color = "#333", size = 15) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.font = `${size}px "PingFang SC","Microsoft YaHei",sans-serif`;
      ctx.fillText(text, sx + dx, sy + dy);
      ctx.restore();
    }

    function render(t) {
      ctx.clearRect(0, 0, CW, CH);

      const P = getP(t);
      const pp = getPrime(t);
      const Ps = prj(P);
      const pps = prj(pp);

      poly([O1w, eLp, eRp, O2w, eRn, eLn],
        "rgba(124,58,237,0.10)", "rgba(124,58,237,0.30)", 1);

      seg(O1w, O2w, "#d97706", 3.5);
      poly(planeCorners(LX), "rgba(210,220,245,0.92)", "#555", 2);
      poly(planeCorners(RX), "rgba(210,220,245,0.92)", "#555", 2);
      seg(eLn, eLp, "#2563eb", 3);
      seg(eRn, eRp, "#2563eb", 3);

      seg(O1w, pw, "#555", 2);
      seg(pw, P, "#666", 2, [7, 5]);
      seg(O2w, pp, "#666", 2, [7, 5]);

      dot(prj(eLw), 6, "#d97706", "#555", 1.5);
      dot(prj(eRw), 6, "#d97706", "#555", 1.5);
      dot(prj(O1w), 9, "#e2e8f0", "#333", 2.5);
      dot(prj(O2w), 9, "#e2e8f0", "#333", 2.5);
      dot(prj(pw), 7, "#059669", "#222", 2);
      dot(Ps, 10, "#e84d2a", "#222", 2.5);
      dot(pps, 7, "#059669", "#222", 2);

      lbl("O₁", prj(O1w), -28, 24, "#333");
      lbl("O₂", prj(O2w), 10, 24, "#333");
      lbl("P", Ps, 12, -10, "#e84d2a", 17);
      lbl("p", prj(pw), -24, -8, "#059669", 15);
      lbl("p′", pps, 10, -8, "#059669", 15);
      lbl("e", prj(eLw), -22, 18, "#b45309", 13);
      lbl("e′", prj(eRw), 8, 18, "#b45309", 13);
      lbl("ℓ", prj(eLp), 5, -10, "#2563eb", 14);
      lbl("ℓ′", prj(eRp), 5, -10, "#2563eb", 14);
      lbl("左像平面", prj([LX, 0, HZ + 0.28]), -36, -10, "#444", 12);
      lbl("右像平面", prj([RX, 0, HZ + 0.28]), -36, -10, "#444", 12);
    }

    const state = {
      playing: true,
      t: 1.4,
      dir: 1,
      speed: 0.005
    };

    function tick() {
      if (state.playing) {
        state.t += state.speed * state.dir;
        if (state.t >= tMax) {
          state.t = tMax;
          state.dir = -1;
        }
        if (state.t <= tMin) {
          state.t = tMin;
          state.dir = 1;
        }
        document.getElementById("sl").value =
          Math.round((state.t - tMin) / (tMax - tMin) * 100);
      }

      render(state.t);
      document.getElementById("info").textContent =
        `深度参数 t = ${state.t.toFixed(3)}，右像点 p′ 由真实投影算出并始终落在 ℓ′ 上`;
      requestAnimationFrame(tick);
    }

    document.getElementById("btn").addEventListener("click", () => {
      state.playing = !state.playing;
      document.getElementById("btn").textContent = state.playing ? "暂停" : "播放";
    });

    document.getElementById("sl").addEventListener("input", (e) => {
      state.t = tMin + Number(e.target.value) / 100 * (tMax - tMin);
      render(state.t);
      document.getElementById("info").textContent =
        `深度参数 t = ${state.t.toFixed(3)}，右像点 p′ 由真实投影算出并始终落在 ℓ′ 上`;
    });

    tick();
  </script>
</body>
</html>
