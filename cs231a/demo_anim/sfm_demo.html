<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SfM Animation Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f4efe6;
      --ink: #1b1b1b;
      --muted: #6c665d;
      --panel: rgba(255, 252, 247, 0.92);
      --line: rgba(39, 34, 28, 0.12);
      --teal: #0f766e;
      --blue: #2563eb;
      --orange: #d97706;
      --red: #dc2626;
      --purple: #7c3aed;
      --green: #059669;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(217, 119, 6, 0.10), transparent 28%),
        radial-gradient(circle at top right, rgba(37, 99, 235, 0.11), transparent 24%),
        linear-gradient(180deg, #f8f3ea 0%, #efe7d9 100%);
      color: var(--ink);
      min-height: 100vh;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      font-size: 32px;
      line-height: 1.1;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .lead {
      color: var(--muted);
      line-height: 1.7;
      font-size: 15px;
      max-width: 920px;
      margin-bottom: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(46, 37, 26, 0.08);
      box-shadow: 0 20px 60px rgba(57, 40, 11, 0.12);
      border-radius: 26px;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.58) 0%, rgba(255,248,238,0.88) 100%);
    }

    .controls {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 14px 16px 18px;
      border-top: 1px solid rgba(31, 23, 14, 0.08);
      background: rgba(255, 250, 243, 0.8);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      background: linear-gradient(135deg, var(--teal), #115e59);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--teal);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .card {
      background: rgba(255, 252, 247, 0.78);
      border: 1px solid rgba(34, 25, 17, 0.08);
      border-radius: 18px;
      padding: 16px 18px;
    }

    .card h2 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .card p {
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
    }

    .legend-item {
      font-size: 13px;
      color: var(--muted);
    }

    .swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    @media (max-width: 900px) {
      h1 { font-size: 27px; }
      .controls { grid-template-columns: 1fr; }
      .hint { white-space: normal; }
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>SfM 是怎么一步步恢复出来的</h1>
    <p class="lead">
      这个动画不是讲公式推导，而是讲流程。你会看到同一个特征点如何先在多张图里被匹配出来，
      再变成两视图几何，接着被三角化成 3D 点，最后和更多相机一起组成稀疏点云。
    </p>

    <div class="panel">
      <canvas id="cvs" width="1120" height="760"></canvas>
      <div class="controls">
        <button id="toggle">暂停</button>
        <input id="timeline" type="range" min="0" max="1000" value="0" />
        <div class="hint" id="phaseLabel">阶段 1/4: 在多张图里找到同一个点</div>
      </div>
    </div>

    <div class="info-grid">
      <div class="card">
        <h2>当前在干嘛</h2>
        <p id="explain"></p>
      </div>
      <div class="card">
        <h2>图例</h2>
        <div class="legend">
          <div class="legend-item"><span class="swatch" style="background:#0f766e"></span>图像上的匹配点</div>
          <div class="legend-item"><span class="swatch" style="background:#dc2626"></span>当前被三角化的 3D 点</div>
          <div class="legend-item"><span class="swatch" style="background:#d97706"></span>相机中心 / baseline</div>
          <div class="legend-item"><span class="swatch" style="background:#2563eb"></span>成像射线</div>
          <div class="legend-item"><span class="swatch" style="background:#7c3aed"></span>第三个相机加入后的多视图约束</div>
          <div class="legend-item"><span class="swatch" style="background:#059669"></span>累计得到的稀疏点云</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("cvs");
    const ctx = canvas.getContext("2d");
    const slider = document.getElementById("timeline");
    const toggle = document.getElementById("toggle");
    const phaseLabel = document.getElementById("phaseLabel");
    const explain = document.getElementById("explain");

    const W = canvas.width;
    const H = canvas.height;
    let playing = true;
    let t = 0;

    const cams = [
      { x: -3.8, y: -0.6, z: 0.8, label: "Cam 1", color: "#d97706" },
      { x: 3.9, y: -0.4, z: 0.4, label: "Cam 2", color: "#d97706" },
      { x: 0.3, y: 3.9, z: 1.0, label: "Cam 3", color: "#7c3aed" }
    ];

    const points = [
      { x: -1.4, y: -0.5, z: -0.2 },
      { x: -0.2, y: -0.8, z: 0.5 },
      { x: 0.8, y: -0.1, z: -0.4 },
      { x: 1.2, y: 0.7, z: 0.2 },
      { x: 0.1, y: 1.0, z: -0.5 },
      { x: -1.0, y: 0.7, z: 0.3 },
      { x: 0.4, y: 0.2, z: 0.8 },
      { x: -0.6, y: 0.1, z: -0.7 }
    ];

    function lerp(a, b, s) {
      return a + (b - a) * s;
    }

    function clamp(v, a, b) {
      return Math.max(a, Math.min(b, v));
    }

    function ease(u) {
      const x = clamp(u, 0, 1);
      return x * x * (3 - 2 * x);
    }

    function project3D(p) {
      const sx = 560 + p.x * 78 + p.y * 42;
      const sy = 260 + p.x * 18 - p.y * 36 - p.z * 80;
      return [sx, sy];
    }

    function imagePoint(camIndex, pointIndex) {
      const cam = cams[camIndex];
      const pt = points[pointIndex];
      const dx = pt.x - cam.x;
      const dy = pt.y - cam.y;
      const dz = pt.z - cam.z;
      return {
        u: clamp(dx * 26 + dy * 8, -88, 88),
        v: clamp(dz * -38 + dy * 6, -64, 64)
      };
    }

    const imgPanels = [
      { x: 96, y: 472, w: 250, h: 180, title: "Image 1" },
      { x: 434, y: 472, w: 250, h: 180, title: "Image 2" },
      { x: 772, y: 472, w: 250, h: 180, title: "Image 3" }
    ];

    function drawRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawPanel(panel) {
      ctx.save();
      drawRoundedRect(panel.x, panel.y, panel.w, panel.h, 18);
      ctx.fillStyle = "rgba(255,255,255,0.88)";
      ctx.fill();
      ctx.strokeStyle = "rgba(48, 35, 24, 0.12)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = "#6c665d";
      ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(panel.title, panel.x + 16, panel.y + 24);

      ctx.strokeStyle = "rgba(50, 42, 32, 0.08)";
      ctx.strokeRect(panel.x + 16, panel.y + 36, panel.w - 32, panel.h - 52);
      ctx.restore();
    }

    function drawImageFeatures(panelIndex, activePoints, glowColor) {
      const panel = imgPanels[panelIndex];
      activePoints.forEach((pointIndex, order) => {
        const pos = imagePoint(panelIndex, pointIndex);
        const cx = panel.x + panel.w / 2 + pos.u;
        const cy = panel.y + panel.h / 2 + pos.v + 8;
        ctx.save();
        ctx.fillStyle = "#0f766e";
        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        ctx.shadowColor = glowColor || "rgba(15,118,110,0.45)";
        ctx.shadowBlur = order === 0 ? 18 : 8;
        ctx.beginPath();
        ctx.arc(cx, cy, order === 0 ? 7 : 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawMatchLine(panelA, pointA, panelB, pointB, alpha) {
      const a = imagePoint(panelA, pointA);
      const b = imagePoint(panelB, pointB);
      const p1 = {
        x: imgPanels[panelA].x + imgPanels[panelA].w / 2 + a.u,
        y: imgPanels[panelA].y + imgPanels[panelA].h / 2 + a.v + 8
      };
      const p2 = {
        x: imgPanels[panelB].x + imgPanels[panelB].w / 2 + b.u,
        y: imgPanels[panelB].y + imgPanels[panelB].h / 2 + b.v + 8
      };
      ctx.save();
      ctx.strokeStyle = `rgba(15, 118, 110, ${alpha})`;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([8, 7]);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
      ctx.restore();
    }

    function drawCamera(cam, emphasized = false) {
      const [sx, sy] = project3D(cam);
      const size = emphasized ? 18 : 14;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.fillStyle = cam.color;
      ctx.strokeStyle = "rgba(60,38,16,0.28)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-size, -size * 0.7);
      ctx.lineTo(size * 0.9, 0);
      ctx.lineTo(-size, size * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = emphasized ? "#26180d" : "#5d4a34";
      ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(cam.label, sx - 24, sy + 28);
    }

    function drawPoint3D(pt, color, radius, shadow) {
      const [sx, sy] = project3D(pt);
      ctx.save();
      ctx.beginPath();
      ctx.arc(sx, sy, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      if (shadow) {
        ctx.shadowColor = shadow;
        ctx.shadowBlur = 20;
      }
      ctx.fill();
      ctx.restore();
    }

    function drawRay(cam, pt, color, width, alpha, dash) {
      const [sx1, sy1] = project3D(cam);
      const [sx2, sy2] = project3D(pt);
      ctx.save();
      ctx.strokeStyle = color.replace("ALPHA", alpha.toFixed(3));
      ctx.lineWidth = width;
      ctx.setLineDash(dash || []);
      ctx.beginPath();
      ctx.moveTo(sx1, sy1);
      ctx.lineTo(sx2, sy2);
      ctx.stroke();
      ctx.restore();
    }

    function drawSceneFrame() {
      ctx.save();
      drawRoundedRect(62, 42, 996, 388, 24);
      ctx.fillStyle = "rgba(255, 251, 245, 0.86)";
      ctx.fill();
      ctx.strokeStyle = "rgba(50, 38, 26, 0.10)";
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.strokeStyle = "rgba(70, 60, 47, 0.12)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(560, 80);
      ctx.lineTo(560, 395);
      ctx.moveTo(130, 300);
      ctx.lineTo(985, 300);
      ctx.stroke();

      ctx.fillStyle = "#6c665d";
      ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText("统一世界坐标系里的相机和稀疏点云", 86, 72);
      ctx.restore();
    }

    function drawObjectSilhouette() {
      const shape = [
        { x: -1.9, y: -0.9, z: -0.4 },
        { x: -0.7, y: -1.2, z: 0.7 },
        { x: 0.9, y: -0.7, z: 1.0 },
        { x: 1.7, y: 0.4, z: 0.3 },
        { x: 1.1, y: 1.4, z: -0.6 },
        { x: -0.4, y: 1.5, z: -0.9 },
        { x: -1.8, y: 0.5, z: -0.1 }
      ].map(project3D);
      ctx.save();
      ctx.fillStyle = "rgba(169, 126, 50, 0.08)";
      ctx.strokeStyle = "rgba(140, 94, 25, 0.18)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(shape[0][0], shape[0][1]);
      for (let i = 1; i < shape.length; i += 1) ctx.lineTo(shape[i][0], shape[i][1]);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawSparseCloud(count, focusIndex, focusColor) {
      for (let i = 0; i < points.length; i += 1) {
        const active = i < count;
        if (!active) continue;
        const color = i === focusIndex ? focusColor : "rgba(5, 150, 105, 0.9)";
        const radius = i === focusIndex ? 8 : 5;
        const shadow = i === focusIndex ? "rgba(220, 38, 38, 0.35)" : null;
        drawPoint3D(points[i], color, radius, shadow);
      }
    }

    function drawStepBadge(index, text, active) {
      const x = 88 + index * 244;
      const y = 96;
      ctx.save();
      drawRoundedRect(x, y, 208, 44, 16);
      ctx.fillStyle = active ? "rgba(15,118,110,0.16)" : "rgba(255,255,255,0.62)";
      ctx.fill();
      ctx.strokeStyle = active ? "rgba(15,118,110,0.40)" : "rgba(44,36,26,0.08)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = active ? "#0f766e" : "#8b7f72";
      ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(text, x + 16, y + 27);
      ctx.restore();
    }

    const phaseTexts = [
      {
        title: "阶段 1/4: 在多张图里找到同一个点",
        body: "先不要急着想 3D。SFM 的第一步只是找 correspondence：同一个空间点在 Image 1、Image 2 里分别落在哪。只有先有这些匹配点，后面才谈得上 F、E、R、T。"
      },
      {
        title: "阶段 2/4: 由匹配点估计两视图几何",
        body: "当同一批点在两张图里被匹配出来后，就可以用它们估计基础矩阵 F 或本质矩阵 E。它们告诉你两台相机之间的相对几何关系，也就是后面恢复相机位姿的桥梁。"
      },
      {
        title: "阶段 3/4: 已知位姿后做三角化",
        body: "现在两台相机的相对位姿已经有了。对同一个匹配点，从 Cam 1 和 Cam 2 各发出一条成像射线，找一个最合理的交会位置，就得到一个 3D 点。很多这样的点累起来，就是稀疏点云。"
      },
      {
        title: "阶段 4/4: 加入更多相机并联合优化",
        body: "当第 3 张图加入后，同一个点就会被 3 个视角一起约束。SFM 不会停在两张图，而是不断加入新相机、新观测，再一起优化所有相机位姿和 3D 点，让整个结果更稳。"
      }
    ];

    function render(progress) {
      ctx.clearRect(0, 0, W, H);

      const phase = progress < 0.25 ? 0 : progress < 0.5 ? 1 : progress < 0.75 ? 2 : 3;
      phaseLabel.textContent = phaseTexts[phase].title;
      explain.textContent = phaseTexts[phase].body;

      drawSceneFrame();
      drawObjectSilhouette();

      for (let i = 0; i < 4; i += 1) {
        drawStepBadge(i, phaseTexts[i].title.replace(/^阶段 \d\/\d: /, ""), i === phase);
      }

      const p1 = ease(progress / 0.25);
      const p2 = ease((progress - 0.25) / 0.25);
      const p3 = ease((progress - 0.5) / 0.25);
      const p4 = ease((progress - 0.75) / 0.25);

      const highlightedPoint = 2;

      drawSparseCloud(Math.floor(lerp(0, 2, p1)), highlightedPoint, "rgba(5,150,105,0.92)");

      if (phase >= 1) {
        drawCamera(cams[0], true);
        drawCamera(cams[1], true);
        drawRay(cams[0], points[highlightedPoint], "rgba(37,99,235,ALPHA)", 3, clamp(0.18 + p2 * 0.75, 0, 0.92));
        drawRay(cams[1], points[highlightedPoint], "rgba(37,99,235,ALPHA)", 3, clamp(0.18 + p2 * 0.75, 0, 0.92));
        const [a, b] = [project3D(cams[0]), project3D(cams[1])];
        ctx.save();
        ctx.strokeStyle = `rgba(217,119,6,${clamp(0.18 + p2 * 0.7, 0, 0.9)})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b[0], b[1]);
        ctx.stroke();
        ctx.restore();
      } else {
        drawCamera(cams[0], true);
        drawCamera(cams[1], true);
      }

      if (phase >= 2) {
        const currentCount = Math.floor(lerp(1, points.length, p3));
        drawSparseCloud(currentCount, highlightedPoint, "rgba(220,38,38,0.94)");
        drawRay(cams[0], points[highlightedPoint], "rgba(37,99,235,ALPHA)", 3, 0.82);
        drawRay(cams[1], points[highlightedPoint], "rgba(37,99,235,ALPHA)", 3, 0.82);
      }

      if (phase >= 3) {
        drawCamera(cams[2], true);
        drawRay(cams[2], points[highlightedPoint], "rgba(124,58,237,ALPHA)", 3.5, clamp(0.2 + p4 * 0.75, 0, 0.95), [8, 7]);
        const refineCount = Math.floor(lerp(3, points.length, p4));
        drawSparseCloud(refineCount, highlightedPoint, "rgba(220,38,38,0.94)");

        ctx.save();
        ctx.fillStyle = `rgba(124,58,237,${clamp(0.12 + p4 * 0.18, 0, 0.3)})`;
        const tri = [cams[0], cams[1], cams[2]].map(project3D);
        ctx.beginPath();
        ctx.moveTo(tri[0][0], tri[0][1]);
        ctx.lineTo(tri[1][0], tri[1][1]);
        ctx.lineTo(tri[2][0], tri[2][1]);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      drawPoint3D(points[highlightedPoint], "rgba(220,38,38,0.96)", 8, "rgba(220,38,38,0.4)");

      imgPanels.forEach(drawPanel);

      const visible12 = [0, 2, 4, 6];
      drawImageFeatures(0, visible12, "rgba(15,118,110,0.4)");
      drawImageFeatures(1, visible12, "rgba(15,118,110,0.4)");
      if (phase >= 3) drawImageFeatures(2, [2, 4, 6], "rgba(124,58,237,0.35)");

      if (phase === 0) {
        const a = clamp(0.25 + p1 * 0.65, 0, 0.9);
        drawMatchLine(0, 2, 1, 2, a);
        drawMatchLine(0, 4, 1, 4, a * 0.8);
        drawMatchLine(0, 6, 1, 6, a * 0.6);
      }

      if (phase >= 1) {
        drawMatchLine(0, 2, 1, 2, 0.9);
      }

      if (phase >= 3) {
        const alpha = clamp(0.28 + p4 * 0.62, 0, 0.9);
        drawMatchLine(1, 2, 2, 2, alpha);
        drawMatchLine(0, 2, 2, 2, alpha * 0.9);
      }

      ctx.save();
      ctx.fillStyle = "#4e453b";
      ctx.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText("下面三块是“图像平面里的观测”，上面大框是“统一世界坐标系里的恢复结果”。", 84, 446);
      ctx.restore();

      ctx.save();
      ctx.fillStyle = "#3d3226";
      ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText("你可以把红色点理解成“当前在讲解的那个 3D 点”。绿色点是已经累计恢复出来的其他稀疏点。", 82, 690);
      ctx.restore();
    }

    slider.addEventListener("input", () => {
      t = Number(slider.value) / 1000;
      render(t);
    });

    toggle.addEventListener("click", () => {
      playing = !playing;
      toggle.textContent = playing ? "暂停" : "播放";
    });

    function loop() {
      if (playing) {
        t += 0.0016;
        if (t > 1) t = 0;
        slider.value = Math.round(t * 1000);
        render(t);
      }
      requestAnimationFrame(loop);
    }

    render(0);
    loop();
  </script>
</body>
</html>
