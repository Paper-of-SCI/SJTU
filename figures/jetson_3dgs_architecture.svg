<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">3DGS edge CUDA rendering system architecture on Jetson Nano</title>
  <desc id="desc">Academic-style system architecture diagram for a Jetson Nano based 3D Gaussian Splatting CUDA rasterization system.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263238"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f5a8a"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 34px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 400 18px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #485461; }
      .panel-title { font: 700 22px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #17212b; }
      .box-title { font: 700 19px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f2d3a; }
      .box-text { font: 400 16px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #263238; }
      .small { font: 400 14px "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #45525f; }
      .code { font: 400 15px "JetBrains Mono", "Consolas", monospace; fill: #203040; }
      .panel { fill: #f7f9fb; stroke: #9aa9b7; stroke-width: 1.5; }
      .panel-blue { fill: #f4f8fc; stroke: #7e9fbd; stroke-width: 1.5; }
      .panel-green { fill: #f5faf7; stroke: #8ab59a; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #607080; stroke-width: 1.3; filter: url(#softShadow); }
      .box-blue { fill: #ffffff; stroke: #2c6f9f; stroke-width: 1.5; filter: url(#softShadow); }
      .box-green { fill: #ffffff; stroke: #4f8a67; stroke-width: 1.5; filter: url(#softShadow); }
      .box-gold { fill: #fffdf7; stroke: #b88a1d; stroke-width: 1.5; filter: url(#softShadow); }
      .arrow { stroke: #263238; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #1f5a8a; stroke-width: 2.4; fill: none; marker-end: url(#arrowBlue); }
      .dash { stroke-dasharray: 8 6; }
      .legend-line { stroke: #263238; stroke-width: 2.2; fill: none; }
      .chip { fill: #e8f1f8; stroke: #7aa0bd; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <text class="title" x="800" y="48" text-anchor="middle">基于 Jetson Nano 的 3DGS 边缘端 CUDA 渲染系统总体架构</text>
  <text class="subtitle" x="800" y="80" text-anchor="middle">训练与部署分离：PC/服务器离线训练，Jetson Nano B01 负责嵌入式端快速前向渲染</text>

  <!-- Left panel: offline training -->
  <rect class="panel" x="50" y="125" width="410" height="640" rx="6"/>
  <text class="panel-title" x="255" y="162" text-anchor="middle">离线训练端</text>
  <text class="small" x="255" y="188" text-anchor="middle">PC / Server GPU</text>

  <rect class="box" x="85" y="225" width="340" height="105" rx="6"/>
  <text class="box-title" x="255" y="258" text-anchor="middle">多视角输入数据</text>
  <text class="box-text" x="115" y="287">• 图像序列 / 视频抽帧</text>
  <text class="box-text" x="115" y="314">• 相机内外参 / COLMAP 位姿</text>

  <rect class="box" x="85" y="385" width="340" height="125" rx="6"/>
  <text class="box-title" x="255" y="419" text-anchor="middle">3DGS 离线训练</text>
  <text class="box-text" x="115" y="449">• 优化 Gaussian 几何与外观</text>
  <text class="box-text" x="115" y="477">• 训练阶段包含反向传播</text>
  <text class="box-text" x="115" y="505">• 板端不执行完整训练</text>

  <rect class="box-gold" x="85" y="565" width="340" height="120" rx="6"/>
  <text class="box-title" x="255" y="599" text-anchor="middle">导出部署模型</text>
  <text class="code" x="115" y="629">Gaussian checkpoint</text>
  <text class="small" x="115" y="657">means / opacity / scale / rotation / SH</text>

  <path class="arrow" d="M255 330 L255 378"/>
  <path class="arrow" d="M255 510 L255 558"/>

  <!-- Middle package -->
  <rect class="panel-green" x="535" y="205" width="320" height="480" rx="6"/>
  <text class="panel-title" x="695" y="242" text-anchor="middle">部署包</text>
  <text class="small" x="695" y="268" text-anchor="middle">面向 Jetson Nano 的最小运行输入</text>

  <rect class="box-green" x="570" y="315" width="250" height="95" rx="6"/>
  <text class="box-title" x="695" y="348" text-anchor="middle">Gaussian 参数</text>
  <text class="small" x="600" y="377">中心、尺度、旋转、不透明度、颜色</text>

  <rect class="box-green" x="570" y="445" width="250" height="80" rx="6"/>
  <text class="box-title" x="695" y="477" text-anchor="middle">相机与渲染配置</text>
  <text class="small" x="600" y="505">view / projection / FOV / resolution</text>

  <rect class="box-green" x="570" y="560" width="250" height="80" rx="6"/>
  <text class="box-title" x="695" y="592" text-anchor="middle">CUDA 扩展源码</text>
  <text class="small" x="600" y="620">ARM64 + sm_53 重新编译</text>

  <path class="arrow-blue" d="M425 625 C475 625 495 445 535 445"/>
  <text class="small" x="482" y="597" text-anchor="middle">模型部署</text>

  <!-- Right panel: Jetson runtime -->
  <rect class="panel-blue" x="930" y="125" width="620" height="640" rx="6"/>
  <text class="panel-title" x="1240" y="162" text-anchor="middle">Jetson Nano B01 嵌入式运行端</text>
  <text class="small" x="1240" y="188" text-anchor="middle">ARM Cortex-A57 CPU + 128-core Maxwell CUDA GPU + 4GB LPDDR4</text>

  <rect class="box-blue" x="970" y="225" width="250" height="105" rx="6"/>
  <text class="box-title" x="1095" y="258" text-anchor="middle">CPU 控制侧</text>
  <text class="box-text" x="1000" y="287">• 加载 checkpoint</text>
  <text class="box-text" x="1000" y="314">• 构造相机与渲染参数</text>

  <rect class="box-blue" x="1260" y="225" width="250" height="105" rx="6"/>
  <text class="box-title" x="1385" y="258" text-anchor="middle">Python 应用层</text>
  <text class="code" x="1290" y="287">GaussianRasterizationSettings</text>
  <text class="code" x="1290" y="314">GaussianRasterizer.forward</text>

  <rect class="box-blue" x="970" y="385" width="250" height="115" rx="6"/>
  <text class="box-title" x="1095" y="418" text-anchor="middle">PyTorch C++ Extension</text>
  <text class="box-text" x="1000" y="448">• Tensor 校验与连续化</text>
  <text class="box-text" x="1000" y="476">• buffer 分配与裸指针传递</text>

  <rect class="box-blue" x="1260" y="385" width="250" height="210" rx="6"/>
  <text class="box-title" x="1385" y="418" text-anchor="middle">CUDA Rasterizer</text>
  <rect class="chip" x="1290" y="442" width="190" height="34" rx="4"/>
  <text class="code" x="1385" y="465" text-anchor="middle">preprocessCUDA</text>
  <rect class="chip" x="1290" y="487" width="190" height="34" rx="4"/>
  <text class="code" x="1385" y="510" text-anchor="middle">CUB scan / sort</text>
  <rect class="chip" x="1290" y="532" width="190" height="34" rx="4"/>
  <text class="code" x="1385" y="555" text-anchor="middle">renderCUDA</text>
  <text class="small" x="1290" y="585">tile-based alpha blending</text>

  <rect class="box-gold" x="970" y="635" width="540" height="90" rx="6"/>
  <text class="box-title" x="1240" y="668" text-anchor="middle">输出结果</text>
  <text class="box-text" x="1010" y="699">RGB 渲染图</text>
  <text class="box-text" x="1168" y="699">alpha 图</text>
  <text class="box-text" x="1308" y="699">radii / visibility</text>
  <text class="box-text" x="1460" y="699" text-anchor="end">性能日志</text>

  <path class="arrow-blue" d="M855 360 C900 360 920 278 965 278"/>
  <path class="arrow-blue" d="M855 485 C900 485 920 438 965 438"/>
  <path class="arrow-blue" d="M855 600 C900 600 920 438 965 438"/>
  <text class="small" x="895" y="340" text-anchor="middle">部署输入</text>

  <path class="arrow" d="M1220 278 L1252 278"/>
  <path class="arrow" d="M1385 330 L1385 378"/>
  <path class="arrow" d="M1220 442 L1252 442"/>
  <path class="arrow" d="M1385 595 L1385 628"/>
  <path class="arrow dash" d="M1095 330 L1095 378"/>
  <path class="arrow dash" d="M1095 500 C1095 585 1160 615 1235 628"/>

  <!-- Hardware annotation -->
  <rect x="1015" y="770" width="450" height="55" rx="6" fill="#ffffff" stroke="#8ea7bd" stroke-width="1.2"/>
  <text class="small" x="1240" y="793" text-anchor="middle">部署约束：ARM64 extension + CUDA sm_53；板端记录 FPS / 显存 / 功耗</text>
  <text class="small" x="1240" y="816" text-anchor="middle">训练不在 Nano 上进行，Nano 负责低功耗前向渲染</text>

  <!-- Legend -->
  <line class="legend-line" x1="70" y1="825" x2="120" y2="825" marker-end="url(#arrow)"/>
  <text class="small" x="132" y="830">控制流 / 调用关系</text>
  <line class="legend-line" x1="300" y1="825" x2="350" y2="825" stroke="#1f5a8a" marker-end="url(#arrowBlue)"/>
  <text class="small" x="362" y="830">数据流 / 部署输入</text>
</svg>
